
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stochastic Challenge</title>
<style>
:root{--text:#0f172a;--muted:#64748b;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#dbeafe,#f8fafc);color:var(--text);min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:20px}
.card{background:white;border-radius:22px;padding:24px;box-shadow:0 14px 35px rgba(15,23,42,.12);margin-top:20px}
h1{text-align:center;font-size:34px;margin:8px 0}.sub{text-align:center;color:var(--muted);margin-bottom:18px}
input{width:100%;font-size:20px;padding:15px;border:1px solid #cbd5e1;border-radius:12px;margin:7px 0}
button{border:0;border-radius:14px;font-weight:800;cursor:pointer}.join{width:100%;background:var(--accent);color:white;font-size:20px;padding:15px;margin-top:10px}
.join:disabled{opacity:.65}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.num{height:90px;font-size:36px;background:#e2e8f0;color:#0f172a}.num.selected{background:#2563eb;color:white;outline:5px solid #93c5fd}
.round{text-align:center;font-size:24px;font-weight:800}.status{text-align:center;background:#eff6ff;border-radius:14px;padding:18px;margin:15px 0;font-size:20px}
.score{text-align:center;font-size:22px}.score b{font-size:34px}.hidden{display:none!important}.error{color:#b91c1c;text-align:center;margin-top:10px;min-height:24px}
.dieArea{text-align:center;margin:16px 0;padding:16px;background:#f8fafc;border-radius:16px;border:1px solid #cbd5e1}
.dieFace{font-size:105px;line-height:1.05;min-height:115px}.dieText{font-size:24px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<h1>🎲 STOCHASTIC CHALLENGE</h1>
<div class="sub">Pick a number. Can you beat randomness?</div>

<div id="joinCard" class="card">
<h2>Join the game</h2>
<input id="room" inputmode="numeric" maxlength="4" placeholder="Room code">
<input id="name" maxlength="40" placeholder="Your name">
<button id="joinBtn" class="join" onclick="joinGame()">JOIN</button>
<div id="joinError" class="error"></div>
</div>

<div id="playCard" class="card hidden">
<div id="round" class="round">Round 1 / 20</div>
<div id="status" class="status">Choose your number</div>

<div id="numbers" class="numbers">
<button class="num" data-n="1" onclick="choose(1)">1</button>
<button class="num" data-n="2" onclick="choose(2)">2</button>
<button class="num" data-n="3" onclick="choose(3)">3</button>
<button class="num" data-n="4" onclick="choose(4)">4</button>
<button class="num" data-n="5" onclick="choose(5)">5</button>
<button class="num" data-n="6" onclick="choose(6)">6</button>
</div>

<div id="dieArea" class="dieArea">
<div id="dieFace" class="dieFace">🎲</div>
<div id="dieText" class="dieText">Waiting for the roll</div>
</div>

<div class="score">Your score: <b id="score">0</b></div>
</div>
</div>

<script>
let room="";
let pollTimer=null;
let lastAnimatedRound=0;
let animating=false;

const dieFaces={1:"⚀",2:"⚁",3:"⚂",4:"⚃",5:"⚄",6:"⚅"};

let playerId=localStorage.getItem("sc_player_id");
if(!playerId){
 playerId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
 localStorage.setItem("sc_player_id",playerId);
}

const params=new URLSearchParams(window.location.search);
if(params.get("room"))document.getElementById("room").value=params.get("room");
if(localStorage.getItem("sc_player_name"))document.getElementById("name").value=localStorage.getItem("sc_player_name");

async function api(path,body){
 const r=await fetch(path,{
   method:body?"POST":"GET",
   headers:body?{"Content-Type":"application/json"}:{},
   body:body?JSON.stringify(body):undefined
 });
 const d=await r.json().catch(()=>({ok:false,error:"Server error"}));
 if(!r.ok||d.ok===false)throw new Error(d.error||"Request failed");
 return d;
}

function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

async function joinGame(){
 room=document.getElementById("room").value.trim();
 const name=document.getElementById("name").value.trim();
 const error=document.getElementById("joinError");
 const button=document.getElementById("joinBtn");
 error.textContent="";

 if(!room||!name){
   error.textContent="Please enter the room code and your name.";
   return;
 }

 button.disabled=true;
 button.textContent="JOINING...";

 try{
   const d=await api("/api/join",{room,name,player_id:playerId});
   localStorage.setItem("sc_player_name",name);
   localStorage.setItem("sc_room",room);
   document.getElementById("joinCard").classList.add("hidden");
   document.getElementById("playCard").classList.remove("hidden");
   render(d.state);
   startPolling();
 }catch(e){
   error.textContent=e.message;
   button.disabled=false;
   button.textContent="JOIN";
 }
}

async function choose(n){
 try{
   const d=await api("/api/predict",{room,player_id:playerId,choice:n});
   render(d.state);
 }catch(e){alert(e.message)}
}

async function animateDie(result,roundNo){
 animating=true;
 const face=document.getElementById("dieFace");
 const text=document.getElementById("dieText");
 text.textContent="Rolling...";
 for(let i=0;i<9;i++){
   face.textContent=dieFaces[1+Math.floor(Math.random()*6)];
   await sleep(90);
 }
 face.textContent=dieFaces[result];
 text.textContent=`RESULT = ${result}`;
 lastAnimatedRound=roundNo;
 animating=false;
}

function render(s){
 document.getElementById("round").textContent=`Round ${s.round} / ${s.total_rounds}`;
 document.getElementById("score").textContent=s.own?s.own.score:0;

 document.querySelectorAll(".num").forEach(btn=>{
   const n=Number(btn.dataset.n);
   btn.disabled=s.status!=="accepting";
   btn.classList.toggle("selected",Boolean(s.own&&s.own.prediction===n));
 });

 const st=document.getElementById("status");
 const nums=document.getElementById("numbers");

 if(s.status==="accepting"){
   nums.classList.remove("hidden");
   if(s.own&&s.own.prediction){
     st.innerHTML=`✓ Your choice: <b>${s.own.prediction}</b><br>Waiting for the teacher to lock and roll...`;
   }else{
     st.textContent="Choose one number";
   }
   if(!animating){
     document.getElementById("dieFace").textContent="🎲";
     document.getElementById("dieText").textContent="Waiting for the roll";
   }

 }else if(s.status==="result"){
   const picked=s.own?s.own.prediction:null;
   const correct=picked===s.result;

   st.innerHTML=`🎲 Result = <b>${s.result}</b><br>${correct?"🎉 Correct! +1 point":"Not this time — next round!"}`;

   if(lastAnimatedRound!==s.round&&!animating){
     animateDie(s.result,s.round);
   }else if(!animating){
     document.getElementById("dieFace").textContent=dieFaces[s.result]||"🎲";
     document.getElementById("dieText").textContent=`RESULT = ${s.result}`;
   }

 }else if(s.status==="finished"){
   nums.classList.add("hidden");
   st.innerHTML=`🏁 Game finished!<br>Your final score: <b>${s.own?s.own.score:0}</b>`;
 }
}

function startPolling(){
 if(pollTimer)clearInterval(pollTimer);
 pollTimer=setInterval(async()=>{
   try{
     const d=await api(`/api/state?room=${encodeURIComponent(room)}&player_id=${encodeURIComponent(playerId)}`);
     render(d.state);
   }catch(e){}
 },700);
}
</script>
</body>
</html>
